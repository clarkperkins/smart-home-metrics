# Default values for smart-home-metrics.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/clarkperkins/shm
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# All three probes hit /health. Set any of them to null to drop it.
# Startup can take over a minute on a busy node, so the startup probe allows up to
# 5 minutes; liveness and readiness don't run until it passes.
startupProbe:
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30

# Tolerates a minute of slow responses (e.g. under disk pressure) before restarting
livenessProbe:
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

readinessProbe:
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

service:
  type: ClusterIP
  port: 80

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# Extra environment variables for non-secret settings, e.g. the NWS collector.
# Secrets (tokens, API keys) belong in the chart's Secret, which is loaded with envFrom.
extraEnv: []
  # - name: NWS_STATIONS
  #   value: KAUS,KATT
  # - name: NWS_USER_AGENT
  #   value: "smart-home-metrics (you@example.com)"

nodeSelector: {}

tolerations: []

affinity: {}

prometheus:
  servicemonitor:
    prometheusInstance: default
    interval: 60s
    scrapeTimeout: 30s
    labels: {}
    honorLabels: false
