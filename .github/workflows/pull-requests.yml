name: Pull Requests

on:
  pull_request:
    branches: [ main ]

# A force-push (e.g. Renovate rebasing) supersedes the PR's in-flight run.
# Deploy runs on main live in deploy.yml and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      # Publish Test Results in build.yml creates a check run
      checks: write
      # Docker jobs in build.yml push pr-N images to GHCR
      packages: write
