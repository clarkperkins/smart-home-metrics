name: Build

on:
  workflow_call:
    outputs:
      version:
        description: Library Version
        value: ${{ jobs.docker-meta.outputs.app-version }}
      image-version:
        description: Image Version
        value: ${{ jobs.docker-meta.outputs.version }}

env:
  REGISTRY_IMAGE: ghcr.io/clarkperkins/shm

# Callers cap these; the docker jobs also need packages: write to push.
permissions:
  contents: read

jobs:
  docker-meta:
    name: Docker Meta

    runs-on: ubuntu-latest

    outputs:
      app-version: ${{ steps.version.outputs.version }}
      version: ${{ steps.meta.outputs.version }}
      labels: ${{ steps.meta.outputs.labels }}
      json: ${{ steps.meta.outputs.json }}
      # Dependabot and fork PRs get a read-only GITHUB_TOKEN, so the GHCR push
      # would fail on packages: write. Still build the image to prove it
      # builds, but skip pushing, the registry cache write and the manifest.
      # github.actor stays dependabot[bot] when a human re-runs the workflow,
      # which is what actually gates the token's permissions.
      push: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}

    steps:
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=ref,event=pr
          flavor: |
            latest=${{ github.ref_name == github.event.repository.default_branch }}

      - name: Library Version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "version=${{ steps.meta.outputs.version }}" >> $GITHUB_OUTPUT
          else
            # Use the date as the semver instead
            echo "version=$(date +'%Y.%-m.%-d')-dev+${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build & Test

    needs:
      - docker-meta

    permissions:
      contents: read
      # Publish Test Results creates a check run
      checks: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Poetry cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/pypoetry
          key: poetry-cache-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            poetry-cache-${{ runner.os }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: |
          python -m pip install --upgrade poetry

      - name: Set Library Version
        run: |
          poetry version ${{ needs.docker-meta.outputs.app-version }}

      - name: Install Dependencies
        run: |
          poetry install

      - name: Run Checks
        run: |
          make check

      - name: Run Tests
        run: |
          make test

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: reports/tests/*.xml
          # Results go in a check run; PR comments would also need pull-requests: write
          comment_mode: "off"

  docker:
    name: Docker Build (${{ matrix.platform }})

    needs:
      - docker-meta

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Prepare
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login to GHCR
        if: needs.docker-meta.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Build and Push by Digest
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            APP_VERSION=${{ needs.docker-meta.outputs.app-version }}
          platforms: ${{ matrix.platform }}
          labels: ${{ needs.docker-meta.outputs.labels }}
          # push-by-digest only means anything when pushing, so fall back to
          # cacheonly rather than push=false: the image still builds, nothing
          # touches the registry.
          outputs: ${{ needs.docker-meta.outputs.push == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.REGISTRY_IMAGE) || 'type=cacheonly' }}
          cache-from: type=registry,ref=${{ env.REGISTRY_IMAGE }}:buildcache-${{ env.PLATFORM_PAIR }}
          # Writing the cache needs a login; reading it does not.
          cache-to: ${{ needs.docker-meta.outputs.push == 'true' && format('type=registry,ref={0}:buildcache-{1},mode=max', env.REGISTRY_IMAGE, env.PLATFORM_PAIR) || '' }}

      - name: Export digest
        if: needs.docker-meta.outputs.push == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.docker_build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: needs.docker-meta.outputs.push == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-merge:
    name: Docker Merge & Push Manifest

    if: needs.docker-meta.outputs.push == 'true'

    needs:
      - docker-meta
      - docker

    permissions:
      contents: read
      packages: write

    runs-on: ubuntu-latest

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          METADATA_JSON: ${{ needs.docker-meta.outputs.json }}
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$METADATA_JSON") \
            $(printf "${REGISTRY_IMAGE}@sha256:%s " *)

      - name: Inspect image
        env:
          VERSION: ${{ needs.docker-meta.outputs.version }}
        run: |
          docker buildx imagetools inspect "${REGISTRY_IMAGE}:${VERSION}"
