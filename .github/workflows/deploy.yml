name: Deploy

on:
  push:
    tags: [ '*' ]
    branches: [ main ]

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker-amd64:
    name: Docker Build & Push (AMD64)
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: clarkperkins
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            APP_VERSION=${{ needs.build.outputs.version }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/clarkperkins/shm:${{ needs.build.outputs.image-version }}-amd64
          labels: ${{ needs.build.outputs.image-labels }}
          cache-from: type=registry,ref=ghcr.io/clarkperkins/shm:buildcache-amd64
          cache-to: type=registry,ref=ghcr.io/clarkperkins/shm:buildcache-amd64,mode=max

  docker-arm64:
    name: Docker Build & Push (ARM64)
    needs: build
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: clarkperkins
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            APP_VERSION=${{ needs.build.outputs.version }}
          platforms: linux/arm64
          push: true
          tags: ghcr.io/clarkperkins/shm:${{ needs.build.outputs.image-version }}-arm64
          labels: ${{ needs.build.outputs.image-labels }}
          cache-from: type=registry,ref=ghcr.io/clarkperkins/shm:buildcache-arm64
          cache-to: type=registry,ref=ghcr.io/clarkperkins/shm:buildcache-arm64,mode=max

  docker-manifest:
    name: Docker Manifest
    needs: [build, docker-amd64, docker-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Docker Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: clarkperkins
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and Push Manifest
        run: |
          # Convert newline-separated tags to array
          IFS=$'\n' read -d '' -r -a TAGS <<< "${{ needs.build.outputs.image-tags }}" || true

          # Create manifest for each tag
          for TAG in "${TAGS[@]}"; do
            docker buildx imagetools create -t "${TAG}" \
              ghcr.io/clarkperkins/shm:${{ needs.build.outputs.image-version }}-amd64 \
              ghcr.io/clarkperkins/shm:${{ needs.build.outputs.image-version }}-arm64
          done

  helm:
    name: Helm Build & Push
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Helm
        uses: azure/setup-helm@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: clarkperkins
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Helm Build
        run: |
          helm package charts/smart-home-metrics -u -d charts --version ${{ needs.build.outputs.version }} --app-version ${{ needs.build.outputs.image-version }}

      - name: Helm Push
        run: |
          helm push charts/smart-home-metrics-${{ needs.build.outputs.version }}.tgz oci://ghcr.io/clarkperkins
