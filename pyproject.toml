[project]
name = "shm"
version = "0.0.0"
description = "Smart Home Prometheus Metrics"
authors = [
    { name = "Clark Perkins", email = "clarkperkins@users.noreply.github.com" }
]
requires-python = ">=3.12.0,<4.0"
dependencies = [
    "anyio>=4.15.1",
    "colorlog>=6.12.0",
    "fastapi>=0.141.1",
    "kubernetes_asyncio>=36.1.0",
    "prometheus-client>=0.26.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyecobee>=1.3.13",
    "pysmartthings>=3.7.3",
    "pyyaml>=6.0.3",
    "uvicorn>=0.53.0",
]


[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "isort>=9.0.1",
    "mypy>=2.3.1",
    "pylint>=4.0.8",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
# Relative exclude-newer durations need a recent uv.
required-version = ">=0.12"
# Don't resolve releases younger than this. Renovate applies the same age to
# the PRs it opens, but its lock file maintenance just runs `uv lock --upgrade`,
# so this is what holds back transitive dependencies. Installing from an
# existing lock is unaffected.
exclude-newer = "3 days"

[tool.uv.build-backend]
# Flat layout: the package lives at ./shm, not ./src/shm.
module-root = ""


[tool.coverage.run]
branch = true
relative_files = true

[tool.coverage.report]
# Regexes for lines to exclude from consideration
exclude_lines = [
    # Have to re-enable the standard pragma
    "pragma: no cover",
    # Don't complain about missing debug-only code:
    "def __repr__",
    "if self.debug",
    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",
    # Don't complain if non-runnable code isn't run:
    "if 0:",
    "if __name__ == .__main__.:",
]

ignore_errors = true

[tool.coverage.html]
directory = "reports/coverage/html"
title = "shm coverage"

[tool.coverage.xml]
output = "reports/coverage/coverage.xml"


[tool.isort]
profile = "black"
skip_gitignore = true

[tool.mypy]
check_untyped_defs = true
plugins = [
    "pydantic.mypy",
]

[[tool.mypy.overrides]]
module = [
    "kubernetes_asyncio.*",
    "pyecobee",
    "pysmartthings",
    "uvicorn",
]
ignore_missing_imports = true
